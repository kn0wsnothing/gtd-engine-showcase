[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtd-engine"
version = "1.0.0"
description = "Local persistent Getting Things Done task application"
requires-python = ">=3.12"

[project.scripts]
gtd = "gtd.cli:main"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["gtd*"]
